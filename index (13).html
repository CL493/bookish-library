<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma bibliothèque</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<meta name="theme-color" content="#6B523C">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F6EDE6;--card:#FBF6F0;--tx:#583523;--mut:#8A7868;--bd:#E2D0A9;--ac:#6B523C;--s0:#C58D5A;--s1:#A56D43;--s2:#E2D0A9;--s3:#B0B9A3;--s4:#D8C8B9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241B16;--card:#33271F;--tx:#F6EDE6;--mut:#C0AC99;--bd:#594333;--ac:#C58D5A}}
:root[data-theme="dark"]{--bg:#241B16;--card:#33271F;--tx:#F6EDE6;--mut:#C0AC99;--bd:#594333;--ac:#C58D5A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Georgia,'Times New Roman',serif}
button,input,select{font:inherit;color:inherit}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{margin:0;font-size:26px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:#dc2626}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs .btn{padding:8px 14px}
.tabs .on{background:var(--ac);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 12px;cursor:pointer;min-height:36px;font-size:14px}
.chip.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-height:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.bk{cursor:pointer}
.cv{aspect-ratio:2/3;border-radius:6px 12px 12px 6px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 14px rgba(0,0,0,.25),inset 6px 0 8px -4px rgba(0,0,0,.4);position:relative;overflow:hidden}
.cv .t{font-weight:bold;font-size:15px;line-height:1.2;text-align:center}
.cv .a{font-size:11px;opacity:.85;text-align:center;font-style:italic}
.cv .lg{font-size:10px;letter-spacing:1px;opacity:.8}
.cv .b{position:absolute;top:0;right:0;font-size:10px;padding:3px 7px;border-radius:0 0 0 8px;color:#fff;font-family:system-ui,sans-serif}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.cv>*:not(img){position:relative;z-index:1}
.cv>.b{position:absolute;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.cv>.sb{position:absolute;left:0;right:0;bottom:0;height:7px}
.cv.has .t,.cv.has .a{display:none}
.cvrow{display:flex;gap:12px;align-items:flex-start}
#cvp{width:84px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;display:none;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.cvb{display:flex;flex-direction:column;gap:6px;flex:1}
.cvb .btn{text-align:center;font-size:14px;padding:8px 10px;min-height:40px;display:flex;align-items:center;justify-content:center;margin:0}
.cv.dz,#box.dz{outline:3px dashed var(--ac);outline-offset:-3px}
.cv.dz{filter:brightness(1.2)}
textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;font:inherit;color:inherit;resize:vertical}
.star{font-size:36px;cursor:pointer;color:#f5a623;padding:0 3px;user-select:none}
.lbl{font-size:12px;color:var(--mut);font-family:system-ui,sans-serif}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fc{display:flex;gap:12px;cursor:pointer;margin:0}
.fcc{width:56px;flex:none;aspect-ratio:2/3;border-radius:4px 8px 8px 4px;overflow:hidden;position:relative}
.fcc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex{margin:6px 0 0;font-size:14px;color:var(--mut)}
.box.wide{max-width:820px;padding:0;background:transparent}
.sheet{--ink:#3a2517;--paper:#fffdf8;--grid:#e8dfd1;position:relative;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border-radius:12px;padding:22px 20px 20px 48px;font-family:'Caveat','Segoe Script','Bradley Hand','Comic Sans MS',cursive;font-size:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.sheet::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:24px;background:radial-gradient(circle,#3a2517 7px,transparent 8px) 0 0/24px 30px repeat-y}
.tape{position:absolute;width:90px;height:28px;background:var(--ac);opacity:.35;transform:rotate(-8deg)}
.tape.t1{top:6px;left:44px}.tape.t2{bottom:12px;right:18px;transform:rotate(-12deg)}
.ttl{margin:0 0 14px;text-align:center;font-size:38px;font-weight:700;line-height:1.1}
.ttl span{background:linear-gradient(transparent 55%,rgba(197,141,90,.45) 55%);padding:0 12px}
.sheet input,.sheet select,.sheet textarea{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:2px 4px;min-height:34px;width:100%;min-width:0}
.sheet textarea{border:0;resize:vertical;line-height:1.35;min-height:0;padding:4px 0}
.top2{display:grid;grid-template-columns:150px 1fr;gap:14px;margin-bottom:12px}
.pcv .cv{width:100%;aspect-ratio:2/3;border:2px solid var(--ink);border-radius:4px}
.pbox{background:var(--paper);border:2px solid var(--ink);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.pbox label{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.pbox .two{display:flex;gap:12px}.pbox .two label{flex:1}
.fmts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.fmt{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:6px 14px;cursor:pointer;opacity:.5;user-select:none}
.fmt.on{opacity:1;background:#EADBBD;box-shadow:0 0 0 2px var(--ink)}
.gl{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.rl{font-size:21px}
.rt{display:inline-flex;gap:2px;white-space:nowrap}
.rt span{font-size:26px;cursor:pointer;opacity:.28;filter:grayscale(1);padding:0 1px;user-select:none;line-height:1.1;font-family:system-ui,sans-serif}
.rt span.on{opacity:1;filter:none}
.rt span[data-s="★"]{color:#f5a623}.rt span[data-s="♥"]{color:#e11d48}
.rt.big span{font-size:40px}
.rbox{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);background:var(--paper);margin:8px 0}
.rbox>div{padding:8px 12px}.rbox>div+div{border-left:2px solid var(--ink)}
.rr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rr .rl{flex:1;min-width:0;line-height:1.1}.rr .rt{flex:none}
.top2>*{min-width:0}
.qbox{border:2px solid var(--ink);background:var(--paper);padding:8px 12px;margin:8px 0}
.qbox>label{display:block;font-size:21px}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.yn{display:flex;gap:18px;justify-content:center;margin-top:4px}
.yb{width:48px;height:48px;border:2.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 28px system-ui,sans-serif;cursor:pointer;opacity:.4;user-select:none}
.yb.on{opacity:1;background:#EADBBD}
.sheet .acts{position:relative;z-index:1}
@media(max-width:640px){.rbox,.row2{grid-template-columns:1fr}.rbox>div+div{border-left:0;border-top:2px solid var(--ink)}.top2{grid-template-columns:1fr}.pcv{width:120px;margin:0 auto}.pbox .two{flex-direction:column;gap:2px}.sheet{padding:18px 12px 18px 40px}.rt span{font-size:24px}.rt.big span{font-size:34px}}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.ro{display:grid;gap:18px}
@media(min-width:960px){.ro{grid-template-columns:minmax(290px,340px) 1fr;align-items:start}}
.rw{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.wsvg{width:min(94vw,560px);height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.rcount{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 18px;font:15px system-ui,sans-serif}
.spin{font-size:20px;padding:14px 32px;border-radius:30px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.busy{pointer-events:none}.busy .rp{opacity:.5}
.rp h3{margin:0 0 8px}
.rchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--ac);border-radius:20px;padding:5px 8px 5px 12px;cursor:pointer;margin:3px;font:14px system-ui,sans-serif}
.rchip small{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.rchip.ed{background:var(--ac);color:#fff}.rchip.ed small{color:#fff}
.rx{font-style:normal;cursor:pointer;padding:2px 7px;border-radius:50%}
.rx:hover{background:rgba(0,0,0,.12)}
.rpick{background:var(--bg);border:1px dashed var(--ac);border-radius:12px;padding:12px;margin-top:10px}
.rtitle{font-weight:bold;margin-bottom:6px}
.rcats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.rcb{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:6px 12px;cursor:pointer;min-height:36px}
.rcb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.rvals{display:flex;flex-wrap:wrap;gap:6px;max-height:240px;overflow:auto;margin-top:8px}
.rv{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:6px 12px;cursor:pointer;font:14px system-ui,sans-serif}
.rv small{color:var(--mut);margin-left:4px}
.rv:hover{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.rbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rinc{display:flex;align-items:center;gap:8px;margin-top:12px;font:14px system-ui,sans-serif}
.rinc input{width:auto;min-height:0}
.rex{margin-top:10px;font:13px system-ui,sans-serif;color:var(--mut)}
.rhint,.rinfo p{color:var(--mut);font:14px system-ui,sans-serif;margin:6px 0}
.rinfo{width:100%;max-width:560px;text-align:center;margin:0}
.rres{display:flex;gap:16px;align-items:flex-start;width:100%;max-width:580px;animation:pop .45s;margin:0}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.rcvw{width:110px;flex:none}.rcvw .cv{width:100%}
.rbody{min-width:0;flex:1}.rbody h3{margin:0 0 2px;font-size:21px}
.seg{stroke:#fffdf8;stroke-width:2}.seg.win{stroke:#3a2517;stroke-width:5}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start;margin-top:14px}
.sgrid .card{margin:0}
.sr{cursor:pointer}
.srh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.srn{font-size:19px}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bd);margin:10px 0 6px}
.sbar i{display:block;height:100%}
.stxt{font:13px system-ui,sans-serif;color:var(--mut)}
.tomes{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.tm{min-width:30px;height:30px;padding:0 6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:600 13px system-ui,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.4);cursor:pointer}
.tm.no{background:transparent;border:1.5px dashed var(--mut);color:var(--mut);text-shadow:none;cursor:default}
.snext{font:14px system-ui,sans-serif;margin-top:6px}
.sdet{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px;cursor:default}
.srow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font:14px system-ui,sans-serif}
.srow .n{width:34px;color:var(--mut);flex:none}
.srow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inf{font-size:12px;color:var(--mut);margin-top:6px;font-family:system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;font-family:system-ui,sans-serif}
.bar span:first-child{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;border-radius:7px;background:var(--ac)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:9}
.mod.on{display:flex}
.box{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:560px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{font-size:12px;color:var(--mut);font-family:system-ui,sans-serif;display:block}
.f .full{grid-column:1/-1}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .sp{flex:1}
.empty{text-align:center;color:var(--mut);padding:40px}
.tag{display:inline-block;font:11px system-ui,sans-serif;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:2px 8px;margin:2px}
</style></head><body>
<div class="w">
 <div class="top"><h1>📚 Ma bibliothèque</h1>
  <div><button class="btn g" id="imp">📂 Importer</button> <button class="btn g" id="allcv">🖼️ Couvertures auto</button> <button class="btn g" id="exp">Exporter CSV</button> <button class="btn" id="add">+ Ajouter</button></div></div>
 <div class="tabs"><button class="btn" id="t1">Bibliothèque</button><button class="btn" id="t2">Statistiques</button><button class="btn" id="t3">📝 Fiches de lecture</button><button class="btn" id="t4">🎡 Roulette</button><button class="btn" id="t5">🗂️ Séries</button></div>
 <div id="lib">
  <div class="chips" id="chips"></div>
  <div class="flt"><input id="q" placeholder="Rechercher titre, auteur…" type="search">
   <select id="fl"></select><select id="fs"></select><select id="ft"></select><select id="fh"></select></div>
  <div class="grid" id="grid"></div>
 </div>
 <div id="stats" style="display:none"></div>
 <div id="fiches" style="display:none"></div>
 <div id="roul" style="display:none"></div>
 <div id="sers" style="display:none"></div>
<datalist id="dls"></datalist>
</div>
<div class="mod" id="mod"><div class="box" id="box"></div></div>
<script>
const KEY='biblio_vierge';
const SEED=[];
const ST=['À lire','En cours','Mis en pause','Terminé','Abandonné'];
const SC=['var(--s0)','var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
const ORD=[1,0,2,3,4];
const HUE={'Romantasy':335,'Dark Fantasy':270,'Urban Fantasy':200,'High/Epic Fantasy':28,'Dystopie':160,'Space Opera':225,'Dark Academia':15,'Paranormal':295};
let books=[],F={q:'',st:-1,l:'',s:'',t:'',h:''},view=1,ref=null,saveT;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const fd=d=>d?new Date(d+'T12:00').toLocaleDateString('fr-FR'):'';
const sti=b=>{const i=ST.indexOf(b.state);return i<0?0:i};
let warned=false;
const WELCOME=`<div class="card" style="grid-column:1/-1;text-align:center;padding:34px 20px"><div style="font-size:48px">📚</div><h3 style="font-size:22px">Ta bibliothèque est vide</h3><p style="color:var(--mut);max-width:480px;margin:6px auto 18px;font-family:system-ui,sans-serif">Ajoute ton premier livre, ou importe d'un coup ta liste depuis un fichier Excel (.xlsx) ou CSV.</p><button class="btn" data-act="add">+ Ajouter un livre</button> <button class="btn g" data-act="imp">📂 Importer un fichier Excel</button></div>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){if(!warned){warned=true;alert('Espace de stockage plein : certaines modifications ne sont pas enregistrées. Utilise plutôt des couvertures automatiques ou des photos plus petites.')}}
 clearTimeout(saveT);saveT=setTimeout(async()=>{if(ref){try{await ref.set({books})}catch(e){}}},600)}
async function init(){
 try{books=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!Array.isArray(books))books=SEED.map(x=>({...x}));
 render();
}
function cover(b){const h=HUE[b.sub[0]]!=null?HUE[b.sub[0]]:hash(b.title)%360,h2=(h+35+hash(b.title)%40)%360;
 return `background:linear-gradient(155deg,hsl(${h} 55% 34%),hsl(${h2} 60% 16%))`}
function uniq(k){return [...new Set(books.flatMap(b=>b[k]))].sort((a,b)=>a.localeCompare(b,'fr'))}
function opts(id,label,k){const e=$(id),v=e.value;e.innerHTML=`<option value="">${label}</option>`+uniq(k).map(x=>`<option>${esc(x)}</option>`).join('');e.value=v}
function filtered(){const q=F.q.toLowerCase();
 return books.filter(b=>(F.st<0||sti(b)==F.st)&&(!F.l||b.lang==F.l)&&(!F.s||b.sub.includes(F.s))&&(!F.t||b.tropes.includes(F.t))&&(!F.h||b.themes.includes(F.h))&&(!q||(b.title+' '+b.author+' '+(b.series||'')).toLowerCase().includes(q)))
 .sort((a,b)=>ORD.indexOf(sti(a))-ORD.indexOf(sti(b))||a.title.localeCompare(b.title,'fr'))}
function render(){
 $('#dls').innerHTML=[...new Set(books.map(b=>b.series).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr')).map(s=>`<option value="${esc(s)}">`).join('');
 $('#t1').className='btn'+(view==1?'':' g');$('#t2').className='btn'+(view==2?'':' g');$('#t3').className='btn'+(view==3?'':' g');$('#t4').className='btn'+(view==4?'':' g');$('#t5').className='btn'+(view==5?'':' g');
 $('#lib').style.display=view==1?'':'none';$('#stats').style.display=view==2?'':'none';$('#fiches').style.display=view==3?'':'none';$('#roul').style.display=view==4?'':'none';$('#sers').style.display=view==5?'':'none';
 const cnt=ST.map((_,i)=>books.filter(b=>sti(b)==i).length);
 $('#chips').innerHTML=`<span class="chip${F.st<0?' on':''}" data-s="-1">Tous (${books.length})</span>`+ST.map((s,i)=>`<span class="chip${F.st==i?' on':''}" data-s="${i}"><span class="dot" style="background:${SC[i]}"></span>${s} (${cnt[i]})</span>`).join('');
 opts('#fl','Toutes langues','lang');opts('#fs','Sous-genre','sub');opts('#ft','Trope','tropes');opts('#fh','Thème','themes');
 const l=filtered();
 $('#grid').innerHTML=l.length?l.map(b=>`<div class="bk" data-id="${b.id}"><div class="cv${b.cover?' has':''}" style="${cover(b)}">${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has');this.remove()">`:''}<i class="sb" style="background:${SC[sti(b)]}"></i><span class="lg">${esc(b.lang)}</span><span class="b" style="background:${SC[sti(b)]}">${ST[sti(b)]}</span><div><div class="t">${esc(b.title)}</div></div><div class="a">${esc(b.author)}</div></div><div class="inf">${b.series?'<b>'+esc(b.series)+(b.tome?' · T'+esc(b.tome):'')+'</b><br>':''}${esc(b.sub.join(' · '))}${b.page?'<br>📖 '+(/^\d+$/.test(b.page)?'p. ':'')+esc(b.page):''}${has(b)?'<br>📝'+(b.fiche.rating?' '+stars(b.fiche.rating):''):''}</div></div>`).join(''):(books.length?'<div class="empty" style="grid-column:1/-1">Aucun livre ne correspond.</div>':WELCOME);
 if(view==2)stats();if(view==3)fiches();if(view==4)roulette();if(view==5)seriesPage();

 return RO.vl.length?RO.vl.map((x,i)=>`<span class="rv" data-vi="${i}">${esc(x[0])}<small>${x[1]}</small></span>`).join(''):'<div class="empty" style="padding:14px">Aucune valeur disponible ici.</div>'}
function roPanel(){
 const chips=RO.crit.map((c,i)=>`<span class="rchip${RO.pick&&RO.pick.i===i?' ed':''}" data-ri="${i}"><small>${CATL[c.cat]}</small><b>${esc(c.val)}</b><i class="rx" data-rx="${i}" title="Retirer ce critère">✕</i></span>`).join('');
 let pk='';
 if(RO.pick){const p=RO.pick;pk=`<div class="rpick"><div class="rtitle">${p.i>=0?'Modifier le critère':RO.crit.length?'Ajouter un critère':'Choisis un premier critère'}</div><div class="rcats">${CATS.map(c=>`<button class="rcb${p.cat==c[0]?' on':''}" data-c="${c[0]}">${c[1]}</button>`).join('')}</div><input id="roq" placeholder="🔍 Rechercher…" value="${esc(RO.q)}"><div class="rvals" id="rvals">${roVals()}</div>${RO.crit.length||p.i>=0?'<button class="btn g" id="rocancel" style="margin-top:10px">Annuler</button>':''}</div>`}
 return `<div class="card rp"><h3>🎯 Mes critères</h3>${chips?`<div class="rcrit">${chips}</div>`:RO.pick?'':'<p class="rhint">Aucun critère : la roulette utilise toute ta pile à lire.</p>'}${pk}<div class="rbtns">${RO.pick?'':'<button class="btn" id="roadd">+ Ajouter un critère</button>'}<button class="btn g" id="rorst">↺ Réinitialiser</button></div><label class="rinc"><input type="checkbox" id="roinc"${RO.incl?' checked':''}> Inclure les livres terminés et abandonnés</label>${RO.ex.length?`<div class="rex">⏸ ${RO.ex.length} livre(s) écarté(s) temporairement <button class="btn g" id="rore" style="min-height:34px;padding:4px 10px">Les réintégrer</button></div>`:''}</div>`}
function wheelSVG(c){const n=c.length,R=200,seg=360/n;
 const pt=(a,r)=>{const t=a*Math.PI/180;return[(r*Math.sin(t)).toFixed(2),(-r*Math.cos(t)).toFixed(2)]};
 let g='';
 if(!n)g='<circle r="200" fill="#e5e0ea"/><text y="7" text-anchor="middle" font-size="22" fill="#7a6f80">Aucun livre</text>';
 else{const fs=n<=8?17:n<=14?14:n<=24?10.5:0,mx=fs?Math.floor((R-62)/(fs*.5)):0;
  c.forEach((b,i)=>{let col=PAL[i%PAL.length];if(n>1&&i==n-1&&i%PAL.length==0)col=PAL[3];
   const a0=i*seg,m=a0+seg/2,win=RO.rid==b.id&&!RO.spinning?' win':'';
   let shape;if(n==1)shape=`<circle r="${R}" fill="${col}" class="seg${win}" data-id="${b.id}"/>`;
   else{const p0=pt(a0,R),p1=pt(a0+seg,R);shape=`<path d="M0 0L${p0[0]} ${p0[1]}A${R} ${R} 0 ${seg>180?1:0} 1 ${p1[0]} ${p1[1]}Z" fill="${col}" class="seg${win}" data-id="${b.id}"/>`}
   const s=short(b),t=s.length>mx?s.slice(0,mx-1)+'…':s;
   g+=shape+(fs?`<text transform="rotate(${m-90}) translate(${R-16},0)" text-anchor="end" dominant-baseline="central" font-size="${fs}" fill="#3a2517">${esc(t)}</text>`:'')})}
 return `<svg viewBox="-232 -248 464 480" class="wsvg" role="img" aria-label="Roulette de lecture"><circle r="214" fill="var(--ac)"/><circle r="206" fill="#fff"/><g id="wh" transform="rotate(${RO.rot})">${g}</g><circle r="36" fill="#fffdf8" stroke="#3a2517" stroke-width="4"/><text y="11" text-anchor="middle" font-size="30">📚</text><polygon id="ptr" points="-18,-246 18,-246 0,-192" fill="var(--ac)" stroke="#3a2517" stroke-width="4" stroke-linejoin="round"/></svg>`}
function roResult(c){
 const b=!RO.spinning&&RO.rid&&books.find(x=>x.id==RO.rid);if(!b)return '';
 const solo=c.length==1,tags=[...(b.genre||[]),...(b.sub||[]),...(b.tropes||[]).slice(0,5)].map(x=>`<span class="tag">${esc(x)}</span>`).join('');
 return `<div class="card rres" id="rres"><div class="rcvw"><div class="cv${b.cover?' has':''}" style="${cover(b)}">${b.cover?`<img src="${esc(b.cover)}" alt="" onerror="this.parentNode.classList.remove('has');this.remove()">`:''}<div><div class="t">${esc(b.title)}</div></div><div class="a">${esc(b.author)}</div></div></div>
 <div class="rbody"><div class="lg" style="font:12px system-ui,sans-serif;color:var(--mut)">${solo?'Un seul livre correspond à ta sélection':'🎉 Ton prochain livre'}</div><h3>${esc(b.title)}</h3><div style="color:var(--mut);font-style:italic">${esc(b.author)}${b.series?' · '+esc(b.series)+(b.tome?' T'+esc(b.tome):''):''}</div>
 <div style="margin:6px 0"><span class="tag" style="background:${SC[sti(b)]};color:#fff;border:0;text-shadow:0 1px 2px rgba(0,0,0,.45)">${ST[sti(b)]}</span>${tags}</div>
 <div class="rbtns" style="margin-top:8px"><button class="btn" id="rofiche">Voir la fiche du livre</button>${solo?'':'<button class="btn g" id="roagain">🎡 Relancer la roulette</button>'}</div>
 ${solo?'':`<label class="rinc"><input type="checkbox" id="roexc"${RO.exc?' checked':''}> Écarter ce livre au prochain tirage</label>`}</div></div>`}
function roulette(force){if(RO.spinning&&!force)return;
 const c=roCands(-1);
 if(RO.rid&&!c.some(b=>b.id==RO.rid))RO.rid=null;
 if(c.length==1&&!RO.spinning)RO.rid=c[0].id;
 let info='';
 if(!c.length){
  if(!books.length)info='<div class="card rinfo"><b>📚 Ta bibliothèque est vide.</b><p>Ajoute des livres ou importe ton fichier Excel pour utiliser la roulette.</p></div>';
  else if(RO.ex.length&&roF(-1,RO.incl,true).length)info='<div class="card rinfo"><b>Tous les livres correspondants ont déjà été écartés.</b><p>Réintègre-les pour relancer la roulette.</p><div class="rbtns" style="justify-content:center"><button class="btn" id="rore">Réintégrer les livres écartés</button></div></div>';
  else{const inc=!RO.incl&&roF(-1,true,false).length;
   info=`<div class="card rinfo"><b>Aucun livre ne correspond à tous ces critères.</b><p>Retire un critère ou choisis-en un autre :</p><div class="rbtns" style="justify-content:center">${RO.crit.map((x,i)=>`<button class="btn g rrm" data-rm="${i}">Retirer « ${esc(x.val)} »</button>`).join('')}${inc?`<button class="btn g" id="roinc2">Inclure les livres terminés (${inc})</button>`:''}</div></div>`}}
 const showSpin=c.length>1&&(!RO.rid||RO.spinning);
 $('#roul').innerHTML=`<div class="ro${RO.spinning?' busy':''}">${roPanel()}<div class="rw"><div class="rcount">🎡 <b>${c.length}</b> livre${c.length>1?'s':''} éligible${c.length>1?'s':''}</div>${wheelSVG(c)}${showSpin?`<button class="btn spin" id="rospin"${RO.spinning?' disabled':''}>${RO.spinning?'La roue tourne…':'🎡 Lancer la roulette'}</button>`:''}${info}${roResult(c)}</div></div>`}
function roSpin(){const c=roCands(-1);if(RO.spinning||c.length<2)return;
 const n=c.length,seg=360/n,w=Math.floor(Math.random()*n),j=(Math.random()-.5)*.7,R0=RO.rot;
 const delta=((((-(w+.5+j)*seg)-R0)%360)+360)%360,total=(5+Math.floor(Math.random()*3))*360+delta;
 const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?900:5600;
 RO.spinning=true;RO.rid=null;RO.win=w;roulette(true);
 const g=$('#wh'),t0=performance.now();
 const step=now=>{const t=Math.min(1,(now-t0)/dur);g.setAttribute('transform','rotate('+(R0+total*ease(t))+')');
  if(t<1)requestAnimationFrame(step);else roEnd(c,R0+total)};
 requestAnimationFrame(step)}
function roEnd(c,R){RO.rot=((R%360)+360)%360;const seg=360/c.length,ang=((-RO.rot%360)+360)%360,idx=Math.min(c.length-1,Math.floor(ang/seg));
 RO.rid=c[idx].id;RO.spinning=false;roulette();const r=$('#rres');if(r)r.scrollIntoView({behavior:'smooth',block:'nearest'})}

/* ---------- SÉRIES ---------- */
const skey=s=>nh(s);
const tn=b=>{const n=parseFloat(String(b.tome==null?'':b.tome).replace(',','.'));return isNaN(n)?1e9:n};
function canonSeries(s,self){s=String(s||'').trim();if(!s)return '';const k=skey(s),o=books.find(b=>b!==self&&b.series&&skey(b.series)==k);return o?o.series:s}
const SV={q:'',f:'all',open:{}};
const SLAB={all:'Toutes',going:'En cours',todo:'À commencer',wait:'À compléter',done:'Terminées'};
function seriesList(){const m=new Map();
 books.forEach(b=>{const s=String(b.series||'').trim();if(!s)return;const k=skey(s);if(!m.has(k))m.set(k,{key:k,name:s,books:[]});m.get(k).books.push(b)});
 return [...m.values()].map(g=>{
  g.books.sort((a,b)=>tn(a)-tn(b)||a.title.localeCompare(b.title,'fr'));
  g.total=Math.max(0,...g.books.map(b=>parseInt(b.stotal)||0));
  const nums=g.books.map(tn).filter(x=>x<1e9);g.maxT=nums.length?Math.ceil(Math.max(...nums)):0;
  g.size=Math.max(g.total,g.maxT,g.books.length);
  g.cnt=ST.map((_,i)=>g.books.filter(b=>sti(b)==i).length);
  g.missing=Math.max(0,g.size-g.books.length);
  const rem=g.cnt[0]+g.cnt[1]+g.cnt[2];
  g.status=rem==0?(g.missing>0?'wait':'done'):(g.cnt[1]+g.cnt[2]+g.cnt[3]>0?'going':'todo');
  g.authors=[...new Set(g.books.map(b=>b.author).filter(Boolean))];
  g.next=g.books.find(b=>sti(b)<3);
  return g}).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}
function serCard(g){
 const open=!!SV.open[g.key],col=g.status=='done'&&g.cnt[4]?SC[4]:{going:SC[1],todo:SC[0],wait:SC[2],done:SC[3]}[g.status];
 const lab={going:'En cours',todo:'À commencer',wait:'Tomes manquants',done:g.cnt[4]?'Arrêtée':'Terminée'}[g.status];
 const sh='color:#fff;border:0;text-shadow:0 1px 2px rgba(0,0,0,.45)';
 const bar=[3,1,2,0,4].filter(i=>g.cnt[i]).map(i=>`<i style="width:${g.cnt[i]/g.size*100}%;background:${SC[i]}" title="${ST[i]} : ${g.cnt[i]}"></i>`).join('');
 const parts=[`${g.cnt[3]}/${g.size} terminé${g.cnt[3]>1?'s':''}`];
 if(g.cnt[1])parts.push(g.cnt[1]+' en cours');if(g.cnt[2])parts.push(g.cnt[2]+' en pause');if(g.cnt[0])parts.push(g.cnt[0]+' à lire');if(g.cnt[4])parts.push(g.cnt[4]+' abandonné'+(g.cnt[4]>1?'s':''));
 if(g.missing)parts.push(g.missing+' tome'+(g.missing>1?'s':'')+' manquant'+(g.missing>1?'s':''));
 const used=new Set(),slots=[],top=Math.max(g.total,g.maxT),chip=(b,l)=>`<span class="tm" data-id="${b.id}" style="background:${SC[sti(b)]}" title="${esc(b.title)} · ${ST[sti(b)]}">${l}</span>`;
 for(let n=1;n<=top;n++){const b=g.books.find(x=>tn(x)==n);if(b){used.add(b);slots.push(chip(b,n))}else slots.push(`<span class="tm no" title="Tome ${n} : pas dans ma bibliothèque">${n}</span>`)}
 g.books.filter(b=>!used.has(b)).forEach(b=>slots.push(chip(b,b.tome?esc(b.tome):'•')));
 const nx=g.next?`<div class="snext">▶ Prochain : <b>${g.next.tome?'T'+esc(g.next.tome)+' · ':''}${esc(g.next.title)}</b></div>`:'';
 const det=open?`<div class="sdet">${g.books.map(b=>`<div class="srow" data-id="${b.id}"><span class="n">${b.tome?'T'+esc(b.tome):'•'}</span><span class="t">${esc(b.title)}</span><span class="tag" style="background:${SC[sti(b)]};${sh}">${ST[sti(b)]}</span></div>`).join('')}<div class="rbtns"><label class="rinc" style="margin:0">Tomes dans la série <input type="number" min="1" style="width:84px;min-height:38px" data-tot="${esc(g.key)}" value="${g.total||''}" placeholder="?"></label><button class="btn" data-sadd="${esc(g.key)}">+ Ajouter un tome</button></div></div>`:'';
 return `<div class="card sr" data-sk="${esc(g.key)}"><div class="srh"><div style="min-width:0"><b class="srn">${esc(g.name)}</b><div class="inf" style="margin:0">${esc(g.authors.join(', '))}${g.authors.length?' · ':''}${g.books.length} livre${g.books.length>1?'s':''}${g.total?' sur '+g.total:''}</div></div><span class="tag" style="background:${col};${sh};flex:none">${lab}</span></div><div class="sbar">${bar}</div><div class="stxt">${parts.join(' · ')}</div><div class="tomes">${slots.join('')}</div>${nx}<div class="inf" style="text-align:center;margin-top:8px">${open?'▲ Replier':'▼ Détails'}</div>${det}</div>`}
function sgridHTML(){const q=nh(SV.q),l=seriesList().filter(g=>(SV.f=='all'||g.status==SV.f)&&(!q||nh(g.name+' '+g.authors.join(' ')).includes(q)));
 return l.length?l.map(serCard).join(''):'<div class="empty" style="grid-column:1/-1">Aucune série ne correspond.</div>'}
function seriesPage(){const all=seriesList();

function commit(){const o={},today=new Date().toISOString().slice(0,10);
 $('#box').querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());
 if(!o.title){return}
 ['genre','sub','themes','tropes'].forEach(k=>o[k]=o[k]?o[k].split(',').map(s=>s.trim()).filter(Boolean):[]);
 o.cover=cc;o.series=canonSeries(o.series,cur);o.stotal=o.stotal?(parseInt(o.stotal)||''):'';
 if(o.state=='En cours'&&!o.start)o.start=today;
 if(o.state=='Terminé'&&!o.end)o.end=today;
 if(cur)Object.assign(cur,o);else books.push({id:Date.now(),...o});
 if(o.series&&o.stotal)books.forEach(x=>{if(x.series&&skey(x.series)==skey(o.series))x.stotal=o.stotal});

 if(e.target.id=='roexc'){RO.exc=e.target.checked;return}
 if(e.target.id=='fpick'&&e.target.value){openFiche(e.target.value);return}if(e.target.id=='cvfile'&&e.target.files[0]){cc=await readImg(e.target.files[0])||cc;prev()}if(e.target.id=='cvurl'){cc=e.target.value.trim();prev()}});
let dzEl=null;
function dz(el){if(dzEl&&dzEl!==el)dzEl.classList.remove('dz');dzEl=el;if(el)el.classList.add('dz')}
function imgFrom(dt){
 const f=[...dt.files].find(x=>x.type.startsWith('image/'));
 if(f)return readImg(f);
 const u=(dt.getData('text/uri-list')||dt.getData('text/plain')||'').split('\n')[0].trim();
 return Promise.resolve(/^https?:\/\//.test(u)?u:'')}
const modOn=()=>$('#mod').classList.contains('on');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();dz(modOn()?e.target.closest('#box'):e.target.closest('.bk .cv'))}));
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)dz(null)});
document.addEventListener('drop',async e=>{e.preventDefault();dz(null);
 const bx=e.target.closest('#box'),bk=e.target.closest('.bk');
 if(modOn()?(!bx||!$('#cvp')):!bk)return;
 const u=await imgFrom(e.dataTransfer);if(!u)return;
 if(modOn()){cc=u;prev()}else{const b=books.find(x=>x.id==bk.dataset.id);if(b){b.cover=u;save();render()}}});
$('#q').oninput=e=>{F.q=e.target.value;render()};
[['#fl','l'],['#fs','s'],['#ft','t'],['#fh','h']].forEach(([i,k])=>$(i).onchange=e=>{F[k]=e.target.value;render()});
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
